name: 'Run Mobile Tests'
description: 'Executes the Enterprise ExecutionManager'
inputs:
  execution-type:
    required: true
  environment:
    required: true
runs:
  using: "composite"
  steps:
    - name: Run Tests
      shell: bash
      env:
        NODE_ENV: ${{ inputs.environment }}
        EXECUTION_TAGS: ${{ inputs.execution-type }}
      run: |
        cd automation/mobile
        npm install
        if [ "$EXECUTION_TAGS" = "regression" ] || [ "$EXECUTION_TAGS" = "smoke" ]; then
          npm run test -- "tests/**/*.test.js" || true
        elif [ -d "tests/$EXECUTION_TAGS" ]; then
          npm run test -- "tests/$EXECUTION_TAGS/**/*.test.js" || true
        else
          npm run test -- "tests/**/*.test.js" || true
        fi
