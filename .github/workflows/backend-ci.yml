name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend-ts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend-ts/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-ts

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: langsphere_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: backend-ts/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Build
      run: npx tsc

    - name: Lint
      run: npm run lint
      continue-on-error: true

    - name: Test
      env:
        DATABASE_URL: postgresql://root:password@localhost:5432/langsphere_test_db?schema=public
      run: npm test
      continue-on-error: true
