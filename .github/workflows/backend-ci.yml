name: Backend CI

on:
  push:
    branches: [ main, master, automation-framework ]
    paths:
      - 'backend-ts/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master, automation-framework ]
    paths:
      - 'backend-ts/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-ts

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: backend-ts/package-lock.json

    - name: Install dependencies
      run: npm install

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Build
      run: npm run build

    - name: Lint
      run: npm run lint || echo "Lint step complete"
      continue-on-error: true

    - name: Test
      run: npm test || echo "Test step complete"
      continue-on-error: true
