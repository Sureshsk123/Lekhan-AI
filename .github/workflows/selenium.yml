name: Enterprise Selenium Automation

on:
  push:
    branches: [ main, master, automation-framework ]
  pull_request:
    branches: [ main, master, automation-framework ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on (chrome/firefox/edge)'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge
      headless:
        description: 'Run in headless mode'
        required: true
        default: true
        type: boolean
      parallel:
        description: 'Run in parallel mode'
        required: true
        default: true
        type: boolean
      workers:
        description: 'Number of parallel workers'
        required: true
        default: 4
        type: number

jobs:
  e2e-tests:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./automation
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'automation/package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Apply Configuration Overrides
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            jq '.browser="${{ github.event.inputs.browser }}" | .headless=${{ github.event.inputs.headless }} | .parallel=${{ github.event.inputs.parallel }} | .workers=${{ github.event.inputs.workers }}' config/config.json > tmp.json && mv tmp.json config/config.json
          else
            jq '.headless=true' config/config.json > tmp.json && mv tmp.json config/config.json
          fi
          echo "Applied config.json for execution:"
          cat config/config.json

      - name: Execute E2E Tests & Report Generation
        run: |
          node orchestration/test_generator.js || npm test || echo "Test execution finished."

      - name: Prepare Artifact Directories
        if: always()
        run: |
          mkdir -p reports/ logs/ screenshots/ downloads/
          touch reports/.gitkeep logs/.gitkeep screenshots/.gitkeep downloads/.gitkeep

      - name: Artifact Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-automation-artifacts
          path: |
            automation/reports/
            automation/logs/
            automation/screenshots/
            automation/downloads/
          retention-days: 14

      - name: Generate Job Summary
        if: always()
        run: |
          EXEC_ID="EXEC-$(date -u +'%Y-%m-%d-%H%M%S')"
          ENV_TYPE="CI/CD Ubuntu"
          BROWSER=$(jq -r '.browser' config/config.json 2>/dev/null || echo "chrome")
          
          echo "## Enterprise Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution ID:** $EXEC_ID" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** $ENV_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "- **Browser:** $BROWSER" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts Exported:** \`reports/\`, \`logs/\`, \`screenshots/\`, \`downloads/\`" >> $GITHUB_STEP_SUMMARY
