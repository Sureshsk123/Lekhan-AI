name: Mobile Release Verification
on:
  release:
    types: [published]
jobs:
  release-verification:
    runs-on: macos-latest
    strategy:
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/shared/setup-mobile
        with:
          api-level: ${{ matrix.api-level }}
      - name: Boot Emulator
        env:
          API_LEVEL: ${{ matrix.api-level }}
        run: ./automation/mobile/scripts/setup-emulator.sh
      - name: Wait for Device
        run: ./automation/mobile/scripts/wait-for-device.sh
      - name: Health Check
        run: ./automation/mobile/scripts/health-check.sh
      - uses: ./.github/shared/run-mobile-tests
        with:
          execution-type: regression
          environment: production
        env:
          APP_PROD_SECRET: ${{ secrets.PROD_API_KEY }}
      - uses: ./.github/shared/publish-artifacts
        if: always()
