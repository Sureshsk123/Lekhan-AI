name: Mobile Regression (Manual)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options: [development, qa, staging, production]
      execution-type:
        description: 'Execution Scope'
        required: true
        default: 'business'
        type: choice
        options: [business, hardware, ui, regression]
      api-level:
        description: 'Android API Level'
        required: true
        default: '33'
jobs:
  execute-regression:
    runs-on: macos-latest
    strategy:
      matrix:
        api-level: [${{ github.event.inputs.api-level }}]
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/shared/setup-mobile
        with:
          api-level: ${{ matrix.api-level }}
      - name: Boot Emulator
        env:
          API_LEVEL: ${{ matrix.api-level }}
        run: ./automation/mobile/scripts/setup-emulator.sh
      - name: Wait for Device
        run: ./automation/mobile/scripts/wait-for-device.sh
      - name: Health Check
        run: ./automation/mobile/scripts/health-check.sh
      - uses: ./.github/shared/run-mobile-tests
        with:
          execution-type: ${{ github.event.inputs.execution-type }}
          environment: ${{ github.event.inputs.environment }}
      - uses: ./.github/shared/publish-artifacts
        if: always()
