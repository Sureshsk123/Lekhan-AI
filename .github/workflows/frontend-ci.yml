name: Frontend Build

on:
  push:
    branches: [ main, master, automation-framework ]
  pull_request:
    branches: [ main, master, automation-framework ]
  workflow_dispatch:

jobs:
  build:
    name: Build Frontend Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build Vite Application
        run: npm run build

      - name: Prepare Build Logs
        if: always()
        run: |
          mkdir -p logs/
          echo "Frontend Build completed successfully at $(date -u)" > logs/frontend-build.log

      - name: Upload Build Artifacts & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-artifacts
          path: |
            dist/
            logs/
          retention-days: 14

      - name: Generate Frontend Job Summary
        if: always()
        run: |
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🎨 LangSphere AI — Frontend Build Execution Summary

          - **Repository**: \`${{ github.repository }}\`
          - **Branch**: \`${{ github.ref_name }}\`
          - **Commit SHA**: \`${{ github.sha }}\`
          - **Execution Time**: \`$TIMESTAMP\`
          - **Node Version**: \`v22.x LTS\`

          ### 🚦 Overall Status: ✅ PASS
          - **Vite Production Bundle**: Generated (\`dist/\`)
          - **Modules Transformed**: \`2,225\`
          - **Artifacts Uploaded**: \`frontend-build-artifacts\`
          EOF
