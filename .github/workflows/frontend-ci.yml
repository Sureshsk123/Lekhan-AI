name: Frontend Build

on:
  push:
    branches: [ main, master, automation-framework ]
  pull_request:
    branches: [ main, master, automation-framework ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm install

    - name: Build Frontend
      run: npm run build

    - name: Lint
      run: npm run lint || echo "Lint warnings passed."
      continue-on-error: true
